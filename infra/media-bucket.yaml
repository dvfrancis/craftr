AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Storage for Craftr class, instructor and profile images, replacing
  Cloudinary. Creates the bucket only. Serving it through CloudFront is a
  separate, later stack.

# Part of issue #112. 42 uploaded images (21 classes, each with a class and an
# instructor image, counted from the live site on 11 August 2026) plus an
# unknown number of profile photographs, which sit behind login and could not
# be counted from outside.
#
# Craftr is the last of the three sites on Cloudinary cloud name dvzs9gve0.
# TARDIS Archives moved in tardis-archives#42 and The Cult Film Club has moved
# since; once this migration finishes the Cloudinary account can be closed
# rather than merely reduced.
#
# Per-app infrastructure lives in the repository it belongs to rather than in
# apps-box-config, matching tardis-archives/infra/ and the-cult-film-club
# /infra/. apps-box-config/infra/ holds only what is shared across the box.
#
# To apply:
#
#   aws cloudformation deploy \
#     --stack-name craftr-media-bucket \
#     --template-file infra/media-bucket.yaml \
#     --region eu-west-2 \
#     --profile admin
#
# No CAPABILITY_NAMED_IAM: this stack creates no roles or policies.

# Deliberately NOT in this stack, in the order they will be needed:
#
#   1. A CloudFront distribution and Origin Access Control. The bucket blocks
#      all public access, so nothing can read it from the internet yet. That
#      is correct for now and blocking later: the images cannot be served
#      until this exists.
#   2. A bucket policy granting that distribution's OAC s3:GetObject. It has
#      to name the distribution ARN, so it cannot be written before the
#      distribution exists.
#   3. s3:PutObject on this bucket for apps-ec2-role, so uploads through the
#      admin and the profile form work. That belongs with the other
#      instance-role grants and is a change to a role this stack does not own.
#
# Each of those is a real decision rather than an oversight, which is why the
# bucket lands on its own first.

Parameters:
  BackupAccountId:
    Type: String
    Default: "639175159992"
    AllowedPattern: "^[0-9]{12}$"
    Description: >-
      The backup account that class and instructor images replicate into. See
      tardis-archives issue #14. The rest of that work lives in
      doubleslash-studio/infra/, because a backup account is account-wide
      rather than specific to this application. Only the rule below is here,
      and only because CloudFormation requires it: a replication rule is a
      property of the bucket resource, and one resource can be owned by
      exactly one stack.

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    # Retain on both, because the bucket will hold the only copy of every
    # uploaded image. Deleting this stack should orphan the bucket, not empty
    # it. A replacing update would be worse still: CloudFormation would create
    # the replacement, then delete the original along with its contents.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Fixed name rather than a generated one. The name appears in the Django
      # settings on the box, in the CloudFront origin, and in the IAM policy
      # ARNs, so a name that changed on replacement would break all three
      # silently.
      #
      # Not "craftr", which would match tardis-archives and the-cult-film-club
      # in using the bare application name. That name is already taken by
      # another AWS account - bucket names are globally unique, and HeadBucket
      # answers 403 rather than 404 for it. The suffixed form matches the
      # account's other per-site buckets, hi-lo-card-game-dominicfrancis and
      # older-and-wider-dominicfrancis.
      BucketName: craftr-dominicfrancis

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            # Cuts the per-object encryption calls S3 makes on its own key.
            # Free, and it matches every other bucket in the account.
            BucketKeyEnabled: true

      # The point of the migration. Cloudinary keeps one copy of each image and
      # nothing else; versioning means an overwrite or a delete through the
      # admin is recoverable. Old versions accumulate with no expiry, which is
      # intended: this bucket will hold well under a gigabyte, so keeping every
      # version indefinitely costs pennies a year and a lifecycle rule would
      # only add a way to lose something.
      VersioningConfiguration:
        Status: Enabled

      # tardis-archives issue #14. Versioning above protects against accident.
      # It does not protect against intent: anyone holding credentials in this
      # account can purge every version in one API call, which is exactly what
      # happened to the tardis-archives covers on 12 August 2026.
      #
      # So a copy goes to an account those credentials do not reach, into a
      # bucket where Object Lock in compliance mode makes deletion impossible
      # for anyone at all, including that account's root user and AWS Support.
      #
      # profiles/ is deliberately absent, and that absence is the point rather
      # than an oversight.
      #
      # Profile photographs are personal data uploaded through the profile
      # form, and an erasure request has to actually erase them. Compliance
      # mode cannot be shortened by anyone, so a replicated profile photograph
      # could not be removed until its retention expired. The lock runs from
      # when the file was written rather than from the request, so most would
      # already be free, but the margin would be gone and nothing could
      # restore it. Leaving them out keeps erasure working as designed, and
      # they are the least costly thing here to lose: the member still has the
      # original and can upload it again, which is not true of class
      # photography.
      #
      # instructors/ is in, because those are published editorial images the
      # site needs to function rather than private uploads, and losing them
      # means rebuilding the class listings by hand.
      #
      # Two rules rather than one with two prefixes, because a replication
      # filter matches a single prefix and there is no way to write an either
      # or. Priorities only settle overlapping rules, and these do not
      # overlap, so the numbers are just labels.
      #
      # DeleteMarkerReplication is Disabled, so removing an image here leaves
      # the backup copy alone. Deletes that name a specific version are never
      # replicated whatever this says, which is the property that would have
      # saved the covers in August.
      #
      # Adding this updates the bucket in place. CloudFormation does not
      # replace a bucket to add replication, so existing objects are
      # untouched. They are also not copied: replication only applies to
      # writes made after the rule exists, so the images already here need a
      # one off S3 Batch Replication job.
      ReplicationConfiguration:
        # Cross-stack import. The role lives in
        # doubleslash-backup-replication-role, in this same account. The
        # import makes that stack undeletable while this rule refers to it,
        # which is the correct dependency rather than an inconvenience.
        Role: !ImportValue backup-replication-role-arn
        Rules:
          - Id: classes-to-backup-account
            Status: Enabled
            Priority: 1
            Filter:
              Prefix: classes/
            DeleteMarkerReplication:
              Status: Disabled
            Destination:
              Bucket: !Sub "arn:aws:s3:::doubleslash-backup-craftr-dominicfrancis-${BackupAccountId}"
              # Naming the expected owner turns a misdirected rule into an
              # error instead of a silent copy to a stranger's bucket.
              Account: !Ref BackupAccountId
              StorageClass: STANDARD

          - Id: instructors-to-backup-account
            Status: Enabled
            Priority: 2
            Filter:
              Prefix: instructors/
            DeleteMarkerReplication:
              Status: Disabled
            Destination:
              Bucket: !Sub "arn:aws:s3:::doubleslash-backup-craftr-dominicfrancis-${BackupAccountId}"
              Account: !Ref BackupAccountId
              StorageClass: STANDARD

      Tags:
        - Key: Application
          Value: craftr
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  BucketName:
    Description: Bucket name, for AWS_STORAGE_BUCKET_NAME in Django settings
    Value: !Ref MediaBucket
    Export:
      Name: craftr-media-bucket-name

  BucketRegionalDomainName:
    Description: Origin domain for the CloudFront distribution added later
    Value: !GetAtt MediaBucket.RegionalDomainName
    Export:
      Name: craftr-media-bucket-domain
